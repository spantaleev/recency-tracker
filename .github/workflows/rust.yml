name: Rust candidate

on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Rust ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spantaleev/recency-tracker-publisher-php
          ref: 3eefe7a453170a5adac57d9ba57307728a9e0a51
          path: php-publisher-reference
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --engine-strict
      - run: python3 -m unittest discover -s rust/release -p 'test_*.py'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.0 fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +1.98.0 clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.98.0 test --manifest-path rust/Cargo.toml --locked
      - run: cargo +1.98.0 build --manifest-path rust/Cargo.toml --locked
      - name: Test generic consumer compatibility against Node and Rust
        env:
          RECENCY_TEST_PHP_SOURCE: ${{ github.workspace }}/php-publisher-reference/src/Devture/Component/RecencyTracker
        run: |
          php --version
          RECENCY_TEST_IMPLEMENTATION=node node --test rust/contract/suite.cjs
          RECENCY_TEST_IMPLEMENTATION=rust RECENCY_TEST_HEARTBEAT=1 node --test rust/contract/suite.cjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: rust/Dockerfile
          load: true
          push: false
          tags: recency-tracker:rust-candidate
          cache-from: type=gha,scope=rust-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.arch }}
      - run: node rust/contract/smoke-container.cjs recency-tracker:rust-candidate
      - name: Export the tested image for release assembly
        env:
          ARCHIVE: ${{ runner.temp }}/rust-image-${{ matrix.arch }}.tar
        run: docker image save --output "$ARCHIVE" recency-tracker:rust-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/rust-image-${{ matrix.arch }}.tar
          retention-days: 3
          if-no-files-found: error
