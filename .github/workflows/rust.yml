name: Rust validation

on:
  workflow_call:
    inputs:
      version:
        description: CalVer release version embedded into the binary; empty builds report "dev"
        default: ''
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Rust security audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', '.github/workflows/rust.yml') }}
      - name: Install the maintained audit tool with locked dependencies
        if: steps.audit-cache.outputs.cache-hit != 'true'
        working-directory: rust
        run: cargo install --locked cargo-audit --version "=$CARGO_AUDIT_VERSION"
      - name: Audit the runtime lockfile against current advisories
        working-directory: rust
        run: cargo audit --file Cargo.lock

  candidate:
    name: Rust ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spantaleev/recency-tracker-publisher-php
          ref: 3eefe7a453170a5adac57d9ba57307728a9e0a51
          path: php-publisher-reference
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spantaleev/recency-tracker
          ref: 3bdfc00524e977d502ca6614642d6a302d51e00f
          path: node-reference
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --engine-strict
      - run: npm ci --prefix node-reference --engine-strict
      - run: npm test
      - run: python3 -m unittest discover -s rust/release -p 'test_*.py'
      - name: Install pinned Rust toolchain
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tomllib
          toolchain = tomllib.loads(pathlib.Path('rust/rust-toolchain.toml').read_text())['toolchain']
          command = ['rustup', 'toolchain', 'install', toolchain['channel'],
                     '--profile', toolchain.get('profile', 'minimal')]
          for component in toolchain.get('components', []):
              command.extend(['--component', component])
          subprocess.run(command, check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RUSTUP_TOOLCHAIN=' + toolchain['channel'] + '\n')
          PY
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --locked
      - name: Test generic consumer compatibility against Node and Rust
        env:
          RECENCY_TEST_NODE_ROOT: ${{ github.workspace }}/node-reference
          RECENCY_TEST_PHP_SOURCE: ${{ github.workspace }}/php-publisher-reference/src/Devture/Component/RecencyTracker
        run: |
          php --version
          RECENCY_TEST_IMPLEMENTATION=node node --test rust/contract/suite.cjs
          RECENCY_TEST_IMPLEMENTATION=rust RECENCY_TEST_HEARTBEAT=1 node --test rust/contract/suite.cjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: recency-tracker:rust-candidate
          build-args: ${{ inputs.version && format('RECENCY_TRACKER_VERSION={0}', inputs.version) || '' }}
          cache-from: type=gha,scope=rust-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.arch }}
      - run: node scripts/smoke-container.js recency-tracker:rust-candidate
      - name: Export the tested image for release assembly
        env:
          ARCHIVE: ${{ runner.temp }}/rust-image-${{ matrix.arch }}.tar
        run: docker image save --output "$ARCHIVE" recency-tracker:rust-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/rust-image-${{ matrix.arch }}.tar
          retention-days: 3
          overwrite: true
          if-no-files-found: error
