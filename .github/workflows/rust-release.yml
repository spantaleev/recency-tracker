name: Rust multi-arch release

# Manual runs validate/build only. A deliberate matching v3 tag is required to publish.
on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the manually selected release version
        id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('rust/Cargo.toml').read_text())['package']['version']
          packages = tomllib.loads(pathlib.Path('rust/Cargo.lock').read_text())['package']
          assert any(p['name'] == 'recency-tracker' and p['version'] == version for p in packages)
          if os.environ['EVENT_NAME'] == 'push':
              tag = os.environ['RELEASE_REF']
              assert re.fullmatch(r'v3\.[0-9]+\.[0-9]+', tag), 'Expected a stable v3 tag'
              assert tag == 'v' + version, 'Tag must match Cargo.toml and Cargo.lock'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY

  checks:
    needs: version
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read

  publish:
    needs: [version, checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v3.')
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: stable
      version: ${{ needs.version.outputs.version }}
