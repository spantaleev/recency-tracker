name: Release

# Cuts CalVer releases (vYYYY.MM.DD.N) from master without a human picking a version.
# rust/release/plan-release.py decides when: unforced runs wait for green CI and for
# Renovate PRs that may still land, so a burst of merges becomes one release.
# Manual runs release master immediately if the image changed since the last release.
# The tag is pushed by this workflow (GITHUB_TOKEN tags trigger no other workflows),
# so it validates and publishes the release itself.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Version numbers derive from existing tags; never let two runs compute one at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether master should be released now
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 rust/release/plan-release.py

  checks:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.plan.outputs.version }}

  tag:
    needs: [plan, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the tested commit
        env:
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate --message "recency-tracker $TAG" "$TAG" "$GITHUB_SHA"
          # Fails rather than moves the tag if it already exists.
          git push origin "refs/tags/$TAG"

  publish:
    needs: [plan, tag]
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: stable
      version: ${{ needs.plan.outputs.version }}
