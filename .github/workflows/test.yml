name: CI

on:
  push:
    branches: [master, 'rewrite/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/rust.yml

  publish-edge:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: edge
